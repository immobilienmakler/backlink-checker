name: Screenshots
on:
  push:
    branches: [main]
    paths:
      - app.py
      - checker.py
      - style.css
      - scripts/screenshots.py
      - .github/workflows/screenshots.yml
  workflow_dispatch:

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Capture app screenshots
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
          python3 scripts/screenshots.py
      - name: Save screenshots in repository
        run: |
          git add docs/check.png docs/report.png
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Screenshots der Weboberfläche aktualisieren'
          git push origin HEAD:main
