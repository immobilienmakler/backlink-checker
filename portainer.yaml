services:
  backlink-checker:
    image: "${BACKLINK_IMAGE:-ghcr.io/immobilienmakler/backlink-checker:latest}"
    restart: unless-stopped
    ports:
      - "${BIND_IP:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:-}
    volumes:
      - backlinks:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  backlinks:
